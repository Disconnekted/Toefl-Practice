name: Build audio and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Safety check (stops here if content has a typo)
        run: |
          node --check app.js
          node --check audio-key.js
          node --check sw.js
          node scripts/validate-content.mjs

      - name: Find audio clips to make
        id: jobs
        run: node scripts/extract-audio-jobs.mjs

      - name: Set up Python
        if: steps.jobs.outputs.missing != '0'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Reuse the downloaded voice model
        if: steps.jobs.outputs.missing != '0'
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: kokoro-voice-model-v1

      - name: Install voice tools
        if: steps.jobs.outputs.missing != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9.4" soundfile
          python -m spacy download en_core_web_sm || true

      - name: Make the audio clips
        if: steps.jobs.outputs.missing != '0'
        run: python scripts/make_audio.py

      - name: Update the audio list
        run: node scripts/extract-audio-jobs.mjs

      - name: Save new audio to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "No new audio."
          else
            git commit -m "Add generated audio"
            # If another build saved audio first, catch up and retry.
            for attempt in 1 2 3; do
              git push && exit 0
              if ! git pull --rebase -X theirs origin main; then
                git rebase --abort || true
                echo "Another build already saved this audio."
                exit 0
              fi
            done
            exit 1
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v5
